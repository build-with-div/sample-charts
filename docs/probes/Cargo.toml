[package]
name = "chart-probes"
version = "0.1.0"
edition = "2021"
publish = false
description = "Probes of Div's public API for drawing charts (see docs/design.md)"

# The probes are integration tests; run one with
# `cargo test --release --test <name> -- --nocapture` from this directory.

[dependencies]
divui = { git = "https://github.com/build-with-div/div", rev = "565db46aa393d29a471973036d1c93d103e3a17a", features = ["testing"] }
# The same Skia Div links (no extra features, so no second Skia build).
skia-safe = "0.94"
plotters = { version = "0.3", default-features = false, features = ["line_series", "point_series", "area_series"] }
plotters-backend = "0.3"

# The framework's dependency patches, which Cargo does not apply to
# dependents. Keep them equal to the pinned Div workspace's.
[patch.crates-io]
skia-safe = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skia-bindings = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skrifa = { git = "https://github.com/build-with-div/div", rev = "565db46aa393d29a471973036d1c93d103e3a17a" }
read-fonts = { git = "https://github.com/build-with-div/div", rev = "565db46aa393d29a471973036d1c93d103e3a17a" }
font-types = { git = "https://github.com/build-with-div/div", rev = "565db46aa393d29a471973036d1c93d103e3a17a" }
bytemuck = { git = "https://github.com/build-with-div/div", rev = "565db46aa393d29a471973036d1c93d103e3a17a" }
bytemuck_derive = { git = "https://github.com/build-with-div/div", rev = "565db46aa393d29a471973036d1c93d103e3a17a" }
zbus_xml = { git = "https://github.com/build-with-div/div", rev = "565db46aa393d29a471973036d1c93d103e3a17a" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.skia-bindings]
opt-level = 3

[profile.release.package.skia-bindings]
opt-level = 3
